<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e1116" />
    <meta
      name="description"
      content="Nauka do egzaminu zawodowego INF.03: HTML, CSS, JavaScript, PHP i SQL. Lekcje, przykłady, quizy i próbny test."
    />
    <title>INF.03 - Nauka do egzaminu</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip" href="#tresc">Przejdź do treści</a>

    <header class="topbar">
      <button
        class="icon-btn menu-btn"
        type="button"
        id="menuBtn"
        aria-label="Otwórz menu"
        aria-expanded="false"
        aria-controls="sidebar"
      >
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path
            d="M4 6h16M4 12h16M4 18h16"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            fill="none"
          />
        </svg>
      </button>
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">INF</span>
        <span class="brand-text" translate="no">INF.03</span>
      </a>
      <form class="search" role="search" id="searchForm">
        <label class="sr-only" for="searchInput">Szukaj tematu</label>
        <svg
          class="search-ico"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          aria-hidden="true"
        >
          <circle
            cx="11"
            cy="11"
            r="7"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
          />
          <path
            d="M20 20l-3.5-3.5"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <input
          id="searchInput"
          name="q"
          type="search"
          placeholder="Szukaj, np. JOIN, float, mysqli…"
          autocomplete="off"
          spellcheck="false"
          enterkeyhint="search"
        />
        <kbd class="search-kbd" aria-hidden="true">/</kbd>
      </form>
      <nav class="top-links" aria-label="Szybkie linki">
        <a href="#/test" class="top-link">Próbny test</a>
      </nav>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar" aria-label="Spis treści">
        <div class="sidebar-inner" id="sidebarNav"></div>
      </aside>
      <div class="scrim" id="scrim" hidden></div>
      <main class="main" id="tresc" tabindex="-1">
        <noscript
          ><p class="noscript">
            Ta strona wymaga włączonej obsługi JavaScript.
          </p></noscript
        >
        <div id="app"></div>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="sr-only" id="ogloszenia" aria-live="assertive"></div>

    <dialog class="dialog" id="dialog" aria-labelledby="dialogTitle">
      <form method="dialog" class="dialog-body">
        <h2 id="dialogTitle" class="dialog-title"></h2>
        <p id="dialogText" class="dialog-text"></p>
        <div class="dialog-actions">
          <button class="btn btn-ghost" value="cancel" type="submit">
            Anuluj
          </button>
          <button
            class="btn btn-primary"
            value="ok"
            type="submit"
            id="dialogOk"
          >
            OK
          </button>
        </div>
      </form>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
